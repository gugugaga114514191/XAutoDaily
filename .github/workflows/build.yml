name: build-fixed-apk

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Android SDK packages
        run: |
          set -e
          SDK="$ANDROID_HOME"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" "platforms;android-33" "build-tools;33.0.1" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "$(dirname "$SDKM")" >> "$GITHUB_PATH"

      - name: Apply fix patch
        run: |
          if [ ! -f xa-fix.patch ]; then
            echo "::error::xa-fix.patch not found at repo root"
            exit 1
          fi
          git apply --verbose xa-fix.patch

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XAutoDaily-debug-fixed
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
